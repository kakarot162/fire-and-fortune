```html
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Fire &amp; Fortune</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="embers"></div>

    <main class="shell">
        <!-- ==================== LOBBY ==================== -->
        <section id="lobby" class="panel lobby">
            <div class="lobby-fire">🔥</div>

            <h1>FIRE &amp; FORTUNE</h1>

            <p>2–5 player multiplayer property game.</p>

            <input
                id="name"
                type="text"
                maxlength="20"
                placeholder="Your name"
                autocomplete="off"
            >

            <div id="joinBox">
                <input
                    id="roomCode"
                    type="text"
                    maxlength="6"
                    placeholder="Room code"
                    autocomplete="off"
                >

                <button id="joinBtn" type="button">
                    Join
                </button>
            </div>

            <button
                id="createBtn"
                class="primary"
                type="button"
            >
                Create Private Game
            </button>

            <p id="error" class="error"></p>
        </section>

        <!-- ==================== GAME ==================== -->
        <section id="game" class="hidden">
            <!-- Top Navigation -->
            <header class="topbar panel">
                <div>
                    <div class="brand">
                        🔥 FIRE &amp; FORTUNE
                    </div>

                    <small>
                        Room
                        <b id="codeLabel"></b>
                        · Play with any 2 to 5 players
                    </small>
                </div>

                <div class="header-actions">
                    <button id="soundBtn" type="button">
                        🔊 Sound
                    </button>

                    <button id="copyBtn" type="button">
                        Copy invite link
                    </button>

                    <button
                        id="startBtn"
                        class="primary hidden"
                        type="button"
                    >
                        Start Game
                    </button>
                </div>
            </header>

            <!-- Main Game Layout -->
            <div class="layout">
                <!-- ==================== BOARD ==================== -->
                <section class="board-wrap panel">
                    <div id="board" class="board">
                        <div class="center">
                            <div class="hearth">
                                🔥
                            </div>

                            <div class="center-title">
                                PROPERTY<br>
                                <span>CHAOS</span>
                            </div>

                            <!-- Decks -->
                            <div class="deck-row">
                                <div class="deck chance-deck">
                                    <div class="deck-top">?</div>
                                    <b>CHANCE</b>
                                    <small>CHAOS DECK</small>
                                </div>

                                <div class="deck random-deck">
                                    <div class="deck-top">✦</div>
                                    <b>RANDOM</b>
                                    <small>WILD DECK</small>
                                </div>
                            </div>

                            <!-- Dice -->
                            <div class="dice-row">
                                <div id="die1" class="die">⚄</div>
                                <div id="die2" class="die">⚄</div>
                            </div>

                            <!-- Turn Information -->
                            <div id="turnText" class="turn">
                                Waiting for players…
                            </div>

                            <div id="timerText" class="timer">
                                45s
                            </div>

                            <!-- Game Actions -->
                            <div class="actions">
                                <button
                                    id="rollBtn"
                                    class="primary"
                                    type="button"
                                    disabled
                                >
                                    Roll 2 Dice
                                </button>

                                <button
                                    id="buyBtn"
                                    type="button"
                                    disabled
                                >
                                    Buy Property
                                </button>

                                <button
                                    id="auctionBtn"
                                    type="button"
                                    disabled
                                >
                                    🔨 Auction
                                </button>

                                <button
                                    id="propertyBtn"
                                    type="button"
                                >
                                    My Properties
                                </button>

                                <button
                                    id="buildBtn"
                                    type="button"
                                    disabled
                                >
                                    🏠 Build
                                </button>

                                <button
                                    id="tradeBtn"
                                    type="button"
                                    disabled
                                >
                                    🤝 Trade
                                </button>

                                <button
                                    id="endBtn"
                                    type="button"
                                    disabled
                                >
                                    End Turn
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- ==================== SIDEBAR ==================== -->
                <aside class="side">
                    <!-- Players -->
                    <section class="panel side-panel">
                        <h3>PLAYERS</h3>

                        <div id="players"></div>
                    </section>

                    <!-- Activity -->
                    <section class="panel side-panel">
                        <h3>ACTIVITY</h3>

                        <div
                            id="log"
                            class="log"
                        ></div>
                    </section>
                </aside>
            </div>
        </section>
    </main>

    <!-- ==================== CARD MODAL ==================== -->
    <div
        id="cardModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="cardLabel"
    >
        <div class="card-pop">
            <div id="cardLabel" class="card-label">
                CHANCE
            </div>

            <div id="cardText" class="card-text"></div>

            <button
                id="closeCard"
                class="primary"
                type="button"
            >
                Continue
            </button>
        </div>
    </div>

    <!-- ==================== PROPERTY MODAL ==================== -->
    <div
        id="propertyModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="propertyTitle"
    >
        <div class="card-pop wide">
            <h2 id="propertyTitle">My Properties</h2>

            <div id="propertyList"></div>

            <button
                type="button"
                data-close="propertyModal"
            >
                Close
            </button>
        </div>
    </div>

    <!-- ==================== AUCTION MODAL ==================== -->
    <div
        id="auctionModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="auctionTitle"
    >
        <div class="card-pop">
            <h2 id="auctionTitle">🔨 Auction</h2>

            <div id="auctionInfo"></div>

            <input
                id="bidAmount"
                type="number"
                min="0"
                placeholder="Your bid"
            >

            <button
                id="bidBtn"
                class="primary"
                type="button"
            >
                Place Bid
            </button>
        </div>
    </div>

    <!-- ==================== TRADE MODAL ==================== -->
    <div
        id="tradeModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tradeTitle"
    >
        <div class="card-pop wide">
            <h2 id="tradeTitle">🤝 Trade</h2>

            <div id="tradeInfo"></div>

            <div id="tradeControls"></div>

            <button
                id="tradeSend"
                class="primary"
                type="button"
            >
                Send Trade
            </button>

            <button
                type="button"
                data-close="tradeModal"
            >
                Close
            </button>
        </div>
    </div>

    <!-- ==================== SCRIPTS ==================== -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/game.js"></script>
</body>
</html>
```
